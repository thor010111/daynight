[package]
name = "daynight"
version = "1.7.4"
edition = "2021"
rust-version = "1.85"
description = "Create macOS dynamic HEIC wallpapers and calculate solar positions from EXIF"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Exercise the Linux/Windows backend on macOS for interoperability tests.
portable = ["dep:libheif-rs", "dep:image", "dep:kamadak-exif", "dep:roxmltree", "dep:tempfile"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17"], optional = true }
# Keep image compatible with the declared Rust 1.85 minimum.
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"], optional = true }
kamadak-exif = { version = "0.6", optional = true }
roxmltree = { version = "0.20", optional = true }
tempfile = { version = "3.15", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
kamadak-exif = "0.6"
roxmltree = "0.20"
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
