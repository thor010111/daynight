[package]
name = "daynight"
version = "1.7.4"
edition = "2021"
rust-version = "1.85"
description = "Create macOS dynamic HEIC wallpapers and calculate solar positions from EXIF"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
core-foundation = "0.10"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
